{{define "title"}}Customers{{end}}

{{define "resource"}}customer{{end}}

{{define "searchFields"}}
<option value="customer-name">Customer Name</option>
<option value="subscriber">Subscriber</option>
<option value="cohort">Cohort</option>
{{end}}
{{define "tableHeaders"}}
<th>id</th>
<th>Customer Name</th>
<th>Subscriber</th>
<th>Cohort</th>
<th>Sign Up Date</th>
{{end}} {{define "tableData"}} {{range .data}}
<tr
    id="row-{{.id}}"
    data-signals="{id: {{.id}}, customer-name: {{.CustomerName}}, subscriber: {{.Subscriber}},cohort: {{.Cohort}}, signup-date: {{.SignupDate}}}"
>
    <td data-text="$id"></td>
    <td data-text="$customer-name"></td>
    <td data-text="$subscriber"></td>
    <td data-text="$cohort"></td>
    <td data-text="$signup-date"></td>
    <td>
        <button
            data-on:click="confirm('Are you sure?') && @delete('/customers?id={{.Id}}')"
        >
            Delete
        </button>
    </td>
    <td>
        <button data-on:click="@get('/customers/edit?id={{.Id}}')">Edit</button>
    </td>
</tr>
{{end}} {{end}} {{define "addResourceInputs"}}
<label for="customer-name">Review</label>
<input id="customer-name" type="text" name="name" required />
{{end}}
