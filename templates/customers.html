<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script
            type="module"
            src="https://cdn.jsdelivr.net/gh/starfederation/datastar@1.0.0-RC.8/bundles/datastar.js"
        ></script>
        <title>Customers</title>
        <link rel="stylesheet" href="./styles.css">
        <style>
            body {
                background-color: lightblue;
                margin: 0 auto;
                /*width: 100%;*/
                text-align: center;
                font-family: sans-serif
            }

            table {
                border: 1px solid black;
                text-align: center;
                margin: 0 auto;
            }
            td {
                border: 1px solid black;
                padding: 1em;
            }

            .navbar-item {
                display: inline-flex;
            }
        </style>
    </head>
    <!--form to add customer name, and then table with customer data -->
    <body>
        <nav>
            <ul>
                <li class="navbar-item"><a href="/customers">Customers</a></li>
                <li class="navbar-item"><a href="/products">Products</a></li>
                <li class="navbar-item"><a href="#">Employees</a></li>
                <li class="navbar-item"><a href="#">Support Tickets</a></li>
                <li class="navbar-item"><a href="/orders">Orders</a></li>
                <li class="navbar-item"><a href="/reviews">Reviews</a></li>
                <li class="navbar-item"><a href="#">Creators</a></li>
            </ul>
        </nav>
        <h1>Customers</h1>
        <div class="wrapper">
            <input
                id="search"
                type="text"
                placeholder="Search..."
                data-bind:query
                data-on:input__debounce.1000ms="@get('/customers/search')"
            />
            <label for="search-by">search by</label>
            <select id="search-by">
                <option data-bind:search-by >Name</option>
            </select>
            <div style="line-height:1.5em;">&#8202;</div>
            <table>
                <thead>
                    <tr>
                        <th>id</th>
                        <th>customer name</th>
                    </tr>
                </thead>
                <tbody id="current-table">
                    {{range .data}}
                    <tr id="row-{{.Id}}">
                        <td data-signals="{Id: {{.Id}} }">{{.Id}}</td>
                        <td data-signals="{Name: '{{.Name}}'}">{{.Name}}</td>
                        <td>
                            <button
                                data-on:click="confirm('Are you sure?') && @delete('/customers?id={{.Id}}')"
                            >
                                Delete
                            </button>
                        </td>
                        <td>
                            <button data-on:click="@get('/customers/edit?id={{.Id}}&name={{.Name}}')">
                                Edit
                            </button>
                        </td>
                    </tr>
                    {{end}}
                </tbody>
            </table>
            <p>Pages</p>
            <div class="page-number">
                <label for="page-number">page number</label>
                <input type="number" id="page-number" min="1" data-bind:page-number data-on:input__debounce.1000ms="@get('/customers/search')" value="1">
            </div>
            <label for="items-per-page">items per page</label>
            <input id="items-per-page" type="number"  min="5" data-bind:items-per-page data-on:input__debounce.1000ms="@get('/customers/search')" value="5">
            <h2> Add a customer</h2>
            <form method="POST" action="/customers">
                <label for="customer_name">customer name</label>
                <input
                    id="customer_name"
                    type="text"
                    name="customer_name"
                    required
                />
                <input type="submit" value="Submit" />
            </form>
        <div>
    </body>
</html>
