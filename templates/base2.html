<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>
            {% block title %}
            {% endblock %}
        </title>
        <script
            type="module"
            src="https://cdn.jsdelivr.net/gh/starfederation/datastar@1.0.0-RC.8/bundles/datastar.js"
        ></script>
        <script>
        function formatCurrency() {
          var myClasses = document.querySelectorAll(".currency");
          myClasses.forEach(i => {
            var currencyType = parseFloat(i.innerText)
            if (!isNaN(currencyType)) {
              i.innerText = Intl.NumberFormat("en-US", {style: "currency", currency: "USD" }).format(i.innerText/100);
            }
          });
        };
        function formatPercent() {
          var num = document.querySelectorAll(".percent");
          num.forEach(i => {
            const percentType = parseFloat(i.innerText)
            if  (!isNaN(percentType)) {
              i.innerText = Intl.NumberFormat("en-US",{style: 'percent', minimumFractionDigits:1}).format(i.innerText/100)
            }
          });
        }
        window.addEventListener('load', formatCurrency)
        window.addEventListener('load', formatPercent)
        </script>
        <style>
        body {
            --light-bg-color: lightblue;
            --dark-bg-color: darkslategrey;
        }
        body {
            background-color: lightblue;
            margin: 0 auto;
            text-align: center;
            font-family: sans-serif;
        }

        table {
            text-align: center;
            margin: 0 auto;
            overflow-x: hidden;
            background: white;
            border-spacing: 0;
        }

        th {
            max-width: 7em;
            padding: 1em;
        }

        td {
            padding: 1em;
        }

        tbody tr:nth-of-type(even) {
            background: #eee;
        }

        thead tr {
            background: #eee;
        }

        tbody tr:nth-of-type(odd) {
            background: white;
        }

        .page-links {
            background: turquoise;
            margin: 0;
            width: 100%;
        }

        .page-links ul {
            margin: 0;
            z-index: 2
        }

        input {
            margin: 1em 0;
            align-items: center;
        }

        .navbar-item {
            display: inline-flex;
            flex-grow: 1;
            padding: 1.5em 0.5em;
        }

        .navbar-item:hover {
            background: darkblue;
        }

        .add-record-form {
            border: 1px solid;
        }

        a {
            text-decoration: none;
        }
        a:hover {
            color: white;
            text-decoration: none;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: darkslategrey;
                color: lightblue;
            }
            a:hover {
                background: lightblue;
                color: black;
                text-decoration: none;
            }
            .navbar-item:hover {
                background: lightblue;
            }
        }

        .add-record-form {
            display: table;
            margin: 0 auto;
            padding: 1em;
        }

        .add-record-form-label {
            display: table-cell;
            width: 50%;
            text-align: right;
            padding-right: 1em;
        }
        .add-record-form-label label {
            line-height: 3em;
        }
        .add-record-form-input {
            display: table-cell;
            width: 50%;
            text-align: left;
        }

        form select {
            margin: 1em 0;
        }



        </style>
        {% block extra_styles %}{% endblock %}
    </head>
    <div>
    <body>
        <header>
        <nav class="page-links">
            <ul>
                <a href="/customers"><li class="navbar-item">Customers</li></a>
                <a href="/products"><li class="navbar-item">Products</li></a>
                <a href="/employees"><li class="navbar-item">Employees</li></a>
                <!--<li class="navbar-item"><a href="#">Support Tickets</a></li>-->
                <a href="/orders"><li class="navbar-item">Orders</li></a>
                <a href="/reviews"><li class="navbar-item">Reviews</li></a>
                <a href="/finances"><li class="navbar-item">Finances</li></a>
                <a href="/manufacturing"><li class="navbar-item">Manufacturing</li></a>
                <a href="/master-budget"><li class="navbar-item">Master Budget</li></a>
                <!--<li class="navbar-item"><a href="#">Creators</a></li>-->
            </ul>
        </nav>
        </header>
        <div class="wrapper">
        <main>
        <h1>{% block resource %}{% endblock %}</h1>
            {% block content %}{% endblock %}
        </main>
        <footer>
          <a href="https://github.com/EnochMwanzo/ecommerce-tracker/">Ecommerce Tracker</a>
        </footer>
        <div>
    </body>
</html>
